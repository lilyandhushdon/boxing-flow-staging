# Netlify settings for Boxing Flow.
# The site is plain files (no build step): everything in this folder is published, and netlify/functions runs as the /api/* functions.
# Payments (Stripe) are built but switched off, and the edge gate that guarded app.html was removed with the paywall (see docs/index.html, "Payments").
[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# the app page must never be cached by the browser, so a new version is always picked up
[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-store"

# the service worker must always be re-checked so a new version of the app reaches installed phones
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Everything in this folder is published, so anything that is not part of the website is answered with a 404 instead, even if a deploy uploads it:
# the private settings file, the documentation, the tests, the database files, the function source and the CI settings.
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://heroic-jalebi-e2e04b.netlify.app/dev-owner.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
