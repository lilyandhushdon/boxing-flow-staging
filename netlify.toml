# Netlify settings for Boxing Flow.
# The site is plain files (no build step): everything in this folder is published, and netlify/functions runs as the /api/* functions.
# Payments (Stripe) are built but switched off, and the edge gate that guarded app.html was removed with the paywall (see docs/index.html, "Payments").
[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# the app page must never be cached by the browser, so a new version is always picked up
[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-store"

# the project documentation lives in this repo but is not part of the public site
[[redirects]]
  from = "/docs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
