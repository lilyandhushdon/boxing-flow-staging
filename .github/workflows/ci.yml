name: CI

# Switched to manual while the app is being built quickly: run it from the Actions tab (Run workflow) whenever you want a full check.
# To check every push and pull request again, put these back under "on:":   push: {branches: [main]}   and   pull_request:
# See docs/index.html, section 10.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Code and data checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # syntax, secrets, migrations, the docs staying in step; quiz, scenario, workout and fighter data; the food search function
      - run: node --test tests/*.test.mjs

  browser:
    name: Browser tests (${{ matrix.browser }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]   # webkit is the closest automatic stand-in for an iPhone
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7
